[package]
name = "voicekey"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "voicekey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Whisper.cpp FFI — platform-specific GPU backends
# macOS: Metal GPU acceleration (see target deps below)
# Windows: CPU-only (works everywhere; CUDA can be added later)

# Async runtime
tokio = { version = "1", features = ["full"] }

# Audio capture
cpal = "0.15"
dasp_sample = "0.11"

# Logging
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# HTTP (model download)
ureq = "2"

# Channels / sync
flume = "0.11"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14", features = ["metal"] }
core-foundation = "0.9"
core-graphics = "0.23"
objc = "0.2"
block = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.14" }   # CPU-only; add features=["cuda"] for Nvidia GPU
windows = { version = "0.58", features = [
  # Keyboard input: SendInput, VIRTUAL_KEY, VK_*, KEYEVENTF_*
  "Win32_UI_Input_KeyboardAndMouse",
  # Accessibility (UIA – reserved for future direct-insertion)
  "Win32_UI_Accessibility",
  # Clipboard: OpenClipboard, SetClipboardData, GetClipboardData, EmptyClipboard, CloseClipboard
  "Win32_System_DataExchange",
  # Global memory: GlobalAlloc, GlobalLock, GlobalUnlock, GMEM_MOVEABLE
  "Win32_System_Memory",
  # Low-level keyboard hook: SetWindowsHookExW, WH_KEYBOARD_LL, KBDLLHOOKSTRUCT, CallNextHookEx
  # Message loop: GetMessageW, TranslateMessage, DispatchMessageW
  "Win32_UI_WindowsAndMessaging",
  # Registry: RegOpenKeyExW, RegQueryValueExW (microphone permission check)
  "Win32_System_Registry",
  # HWND, HANDLE, LPARAM, LRESULT, WPARAM
  "Win32_Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
